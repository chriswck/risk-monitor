# Hypothetical APAC Risk Monitor — Week 1 portfolio definition
# Edit this file freely. Instrument tickers and weights live ONLY here.
# Weights must sum to 1.0 (±0.001). Sleeves: rates | ig_credit | hy_em | fx | alternatives

